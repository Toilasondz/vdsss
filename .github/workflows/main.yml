name: Build VideoStarTool Tweak

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget libxml2-utils xz-utils
          
          # Tải và cài đặt ldid thủ công
          sudo wget -O /usr/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo chmod +x /usr/bin/ldid

      - name: Setup Theos & Official Linux Toolchain
        run: |
          # 1. Tải Theos cốt lõi
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # 2. Tải iOS SDK
          sudo mkdir -p $HOME/theos/sdks
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks_temp
          mv $HOME/theos/sdks_temp/*.sdk $HOME/theos/sdks/
          rm -rf $HOME/theos/sdks_temp

          # 3. Tải bộ toolchain Linux chuẩn của Theos
          mkdir -p $HOME/theos/toolchain/linux/iphone
          curl -L -o toolchain.tar.zst https://github.com/theos/toolchain/releases/download/llvm-16.0.6-2/linux-amd64.tar.zst || \
          curl -L -o toolchain.tar.zst https://github.com/theos/toolchain/releases/latest/download/linux-amd64.tar.zst
          
          sudo apt-get install -y zstd
          tar --use-compress-program=unzstd -xf toolchain.tar.zst -C $HOME/theos/toolchain/linux/iphone
          rm toolchain.tar.zst

      - name: Build Package & Sign Dylib
        run: |
          export THEOS=$HOME/theos
          make package
          
          # Tự ký dylib bằng ldid trước khi đóng gói để tránh lỗi CodeSignature trên điện thoại
          if [ -f ".theos/obj/VideoStarTool.dylib" ]; then
            ldid -S .theos/obj/VideoStarTool.dylib
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-deb
          path: packages/*.deb
