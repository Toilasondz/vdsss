name: Build VideoStarTool Tweak

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget libxml2-utils
          
          # Tải và cài đặt ldid thủ công
          sudo wget -O /usr/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo chmod +x /usr/bin/ldid

      - name: Setup Theos & Official Toolchain via Git
        run: |
          # 1. Tải Theos cốt lõi (kèm luôn toolchain chính hãng qua cơ chế submodule nếu có, hoặc clone riêng)
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # 2. Tải iOS SDK
          sudo mkdir -p $HOME/theos/sdks
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks_temp
          mv $HOME/theos/sdks_temp/*.sdk $HOME/theos/sdks/
          rm -rf $HOME/theos/sdks_temp

          # 3. Clone trực tiếp toolchain Linux chính thức của Theos từ GitHub (Tránh hoàn toàn lỗi file nén hỏng)
          mkdir -p $HOME/theos/toolchain/linux
          git clone --depth=1 https://github.com/theos/toolchain-linux.git $HOME/theos/toolchain/linux/iphone

      - name: Build Package & Sign Dylib
        run: |
          export THEOS=$HOME/theos
          make package
          
          # Tự ký dylib bằng ldid trước khi đóng gói
          if [ -f ".theos/obj/VideoStarTool.dylib" ]; then
            ldid -S .theos/obj/VideoStarTool.dylib
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-deb
          path: packages/*.deb
